<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قطة صغيرة 🐱</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #ffd6e7, #cce7ff);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الخلفية */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .cloud {
            position: absolute;
            width: 150px;
            height: 50px;
            background: rgba(255,255,255,0.65);
            border-radius: 50px;
            animation: cloudMove 20s linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud::before {
            width: 70px;
            height: 70px;
            left: 25px;
            bottom: 10px;
        }

        .cloud::after {
            width: 90px;
            height: 90px;
            right: 20px;
            bottom: 5px;
        }

        .cloud1 {
            top: 15%;
            left: -200px;
        }

        .cloud2 {
            top: 35%;
            left: -300px;
            animation-delay: 8s;
            transform: scale(.7);
        }

        @keyframes cloudMove {
            from {
                transform: translateX(-250px);
            }
            to {
                transform: translateX(120vw);
            }
        }

        /* العنوان */
        .content {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #5b315b;
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 2px 3px 5px rgba(0,0,0,.15);
        }

        .subtitle {
            color: #754d75;
            font-size: 18px;
            margin-bottom: 30px;
        }

        /* القطة */
        .cat {
            width: 220px;
            height: 210px;
            position: relative;
            margin: auto;
            animation: floating 2.5s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* الرأس */
        .head {
            position: absolute;
            width: 150px;
            height: 135px;
            background: #f4a261;
            border-radius: 50%;
            left: 35px;
            top: 20px;
            border: 4px solid #c9793f;
        }

        /* الأذنين */
        .ear {
            position: absolute;
            width: 55px;
            height: 65px;
            background: #f4a261;
            top: -25px;
            border: 4px solid #c9793f;
            z-index: -1;
        }

        .ear.left {
            left: 15px;
            transform: rotate(-25deg);
            border-radius: 10px 45px 10px 20px;
        }

        .ear.right {
            right: 15px;
            transform: rotate(25deg);
            border-radius: 45px 10px 20px 10px;
        }

        .ear::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 35px;
            background: #ffb6c9;
            border-radius: 50%;
            left: 10px;
            top: 10px;
        }

        /* العيون */
        .eye {
            position: absolute;
            width: 23px;
            height: 28px;
            background: #38251f;
            border-radius: 50%;
            top: 55px;
            animation: blink 4s infinite;
        }

        .eye.left {
            left: 38px;
        }

        .eye.right {
            right: 38px;
        }

        .eye::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            top: 5px;
            left: 5px;
        }

        @keyframes blink {
            0%, 92%, 100% {
                transform: scaleY(1);
            }
            95% {
                transform: scaleY(.1);
            }
        }

        /* الأنف */
        .nose {
            position: absolute;
            width: 18px;
            height: 14px;
            background: #e76f91;
            border-radius: 50%;
            top: 88px;
            left: 66px;
        }

        /* الفم */
        .mouth {
            position: absolute;
            width: 30px;
            height: 15px;
            border-bottom: 3px solid #633;
            border-radius: 50%;
            top: 97px;
            left: 60px;
        }

        /* الشوارب */
        .whiskers {
            position: absolute;
            top: 91px;
            width: 45px;
            height: 2px;
            background: #633;
        }

        .w1 {
            left: -35px;
            transform: rotate(8deg);
        }

        .w2 {
            left: -35px;
            top: 102px;
            transform: rotate(-8deg);
        }

        .w3 {
            right: -35px;
            transform: rotate(-8deg);
        }

        .w4 {
            right: -35px;
            top: 102px;
            transform: rotate(8deg);
        }

        /* الجسم */
        .body {
            position: absolute;
            width: 120px;
            height: 100px;
            background: #f4a261;
            border-radius: 60% 60% 45% 45%;
            left: 50px;
            top: 125px;
            border: 4px solid #c9793f;
        }

        /* الذيل */
        .tail {
            position: absolute;
            width: 85px;
            height: 35px;
            border: 12px solid #f4a261;
            border-left: none;
            border-radius: 0 50px 50px 0;
            right: -25px;
            top: 140px;
            animation: tailMove 1s ease-in-out infinite alternate;
        }

        @keyframes tailMove {
            from {
                transform: rotate(-5deg);
            }
            to {
                transform: rotate(15deg);
            }
        }

        /* الأقدام */
        .paw {
            position: absolute;
            width: 45px;
            height: 30px;
            background: #f4a261;
            border-radius: 50%;
            bottom: -10px;
            border: 3px solid #c9793f;
        }

        .paw.left {
            left: 48px;
        }

        .paw.right {
            right: 48px;
        }

        /* زر */
        button {
            margin-top: 25px;
            padding: 13px 35px;
            border: none;
            border-radius: 30px;
            background: #8e548e;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
            transition: .3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #713f71;
        }

        /* القلوب */
        .heart {
            position: absolute;
            color: #ff6f91;
            font-size: 25px;
            animation: heartFloat 5s linear infinite;
            opacity: .8;
        }

        @keyframes heartFloat {
            from {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: .8;
            }

            to {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .heart:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 75%;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            left: 90%;
            animation-delay: 3s;
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <div class="heart">♥</div>
        <div class="heart">♥</div>
        <div class="heart">♥</div>
        <div class="heart">♥</div>
    </div>

    <div class="content">

        <h1>🐱 مرحباً بك</h1>

        <p class="subtitle">
            أنا قطة صغيرة سعيدة لرؤيتك ♥
        </p>

        <div class="cat">

            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="head">

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="nose"></div>
                <div class="mouth"></div>

                <div class="whiskers w1"></div>
                <div class="whiskers w2"></div>
                <div class="whiskers w3"></div>
                <div class="whiskers w4"></div>

            </div>

            <div class="body"></div>

            <div class="tail"></div>

            <div class="paw left"></div>
            <div class="paw right"></div>

        </div>

        <button onclick="sayHello()">
            اضغط هنا ♥
        </button>

    </div>

    <script>
        function sayHello() {
            alert("مياااو 🐱♥");
        }
    </script>

</body>
</html>
